<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!--
      Bevidst INGEN apple-mobile-web-app-status-bar-style. Målt på telefonen 2026-09-11 med fem
      varianter installeret side om side:
        - black-translucent (+ viewport-fit=cover): iOS flytter websiden op under uret uden at
          gøre den højere → 62 px sort stribe under bundmenuen, som ingen CSS kan nå.
        - black: ugennemsigtig sort statuslinje.
        - ingen meta: websiden starter under uret og når skærmens underkant med safe-area i
          bunden, og iOS maler selv statuslinjen som en forlængelse af sidens overkant.
      Værdien læses kun ved installation: ændres den, skal genvejen slettes og lægges på igen.
    -->
    <meta name="apple-mobile-web-app-title" content="Vigorra" />
    <title>Vigorra</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
